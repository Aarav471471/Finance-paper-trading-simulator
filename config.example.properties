# Copy this file to "config.properties" (same folder as pom.xml) and fill it in.
# config.properties is git-ignored, so your API key is never committed.

# live      = real prices from the internet (default)
# simulated = random-walk prices, works offline
data.mode=live

# Free key from https://finnhub.io/register  (real-time US stock and ETF quotes).
# Leave empty to use Yahoo Finance for stocks/ETFs instead (no key needed, unofficial).
finnhub.apiKey=
