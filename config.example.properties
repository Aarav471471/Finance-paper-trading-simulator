# Copy this file to "config.properties" (same folder as pom.xml) and fill it in.
# config.properties is git-ignored, so your API key is never committed.

# live      = real prices from the internet (default)
# simulated = random-walk prices, works offline
data.mode=live

# Free key from https://finnhub.io/register  (real-time US stock and ETF quotes).
# Leave empty to use Yahoo Finance for stocks/ETFs instead (no key needed, unofficial).
finnhub.apiKey=

# Groww Trade API (https://groww.in/trade-api): real NSE prices for the Indian shares.
# Used ONLY to read prices. The app never places real orders; every trade stays paper trading.
# Option A (recommended): API key + secret. Approve the key once a day on the Groww Cloud
#           "API Keys" page; the app then logs in by itself.
# Option B: paste a ready-made access token instead (it expires every day).
# Leave all three empty to get Indian prices from Yahoo Finance instead.
# If Groww fails (key not approved today, Groww down), Yahoo Finance is used automatically.
groww.apiKey=
groww.apiSecret=
groww.accessToken=
