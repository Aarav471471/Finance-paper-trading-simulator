# Publishes the browser demo to a Hugging Face Space (Docker + noVNC).
#
# One-time setup in the GitHub repo (Settings -> Secrets and variables -> Actions):
#   Secret   HF_TOKEN         Hugging Face access token with "write" permission (required)
#   Variable HF_SPACE         Space name, e.g. "your-hf-username/papertrader" (optional,
#                             defaults to <token owner>/papertrader)
#   Secret   FINNHUB_API_KEY  free key from finnhub.io (optional, Yahoo is used without it)
name: Deploy browser demo (Hugging Face)

on:
  push:
    branches: [main]
    paths: ["src/main/**", "pom.xml", "Dockerfile", "docker/**", "deploy/huggingface/**", ".github/workflows/deploy-huggingface.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-huggingface
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - name: Check for the Hugging Face token
        id: check
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret is not set, skipping the Hugging Face deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: Collect the files the Space needs
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir space
          cp -r Dockerfile pom.xml src docker space/
          rm -rf space/src/test
          cp deploy/huggingface/README.md space/README.md

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Upload to the Space
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install --quiet "huggingface_hub>=0.25"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ.get("HF_SPACE") or f"{api.whoami()['name']}/papertrader"
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          if os.environ.get("FINNHUB_API_KEY"):
              api.add_space_secret(space, "FINNHUB_API_KEY", os.environ["FINNHUB_API_KEY"])
          api.upload_folder(
              folder_path="space",
              repo_id=space,
              repo_type="space",
              delete_patterns=["*"],
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]} from GitHub",
          )
          owner, name = space.split("/")
          url = f"https://{owner.lower()}-{name.lower().replace('_', '-').replace('.', '-')}.hf.space"
          print(f"Deployed. Space page: https://huggingface.co/spaces/{space}")
          print(f"App URL: {url}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### Browser demo deployed\n\n- App: {url}\n- Space: https://huggingface.co/spaces/{space}\n\nThe Space takes a few minutes to build after each deploy.\n")
          PY
